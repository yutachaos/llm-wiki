<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llm-wiki</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d1d9e0;
    --accent: #0969da;
    --sidebar-bg: #f6f8fa;
    --code-bg: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8d96a0;
      --border: #30363d;
      --accent: #4493f8;
      --sidebar-bg: #161b22;
      --code-bg: #161b22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    min-height: 100vh;
  }
  nav {
    width: 300px;
    flex-shrink: 0;
    padding: 24px 16px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    font-size: 13px;
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  nav h1 { font-size: 16px; margin: 0 0 12px; }
  nav h1 a { color: var(--fg); text-decoration: none; }
  nav h2, nav h3 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  nav ul { list-style: none; padding: 0; margin: 0; }
  nav li { margin: 2px 0; }
  nav a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
  nav a:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  nav a.active { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  nav p { display: none; }
  main { flex: 1; min-width: 0; display: flex; justify-content: center; }
  article { max-width: 780px; width: 100%; padding: 40px 48px 80px; line-height: 1.75; }
  article h1 { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  article a { color: var(--accent); }
  article table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
  article th, article td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
  article th { background: var(--sidebar-bg); }
  article code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 0.9em; }
  article pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; overflow-x: auto; }
  article pre code { border: none; padding: 0; }
  article blockquote { margin: 0; padding-left: 16px; border-left: 3px solid var(--border); color: var(--muted); }
  @media (max-width: 720px) {
    body { flex-direction: column; }
    nav { width: 100%; height: auto; position: static; }
    article { padding: 24px 20px 60px; }
  }
</style>
</head>
<body>
<nav id="sidebar"></nav>
<main><article id="content">読み込み中...</article></main>
<script>
const HOME = 'wiki/index.md';

function currentPath() {
  return decodeURIComponent(location.hash.slice(1)) || HOME;
}

function stripFrontmatter(md) {
  return md.replace(/^---\n[\s\S]*?\n---\n/, '');
}

// 相対 .md リンクを、記事のディレクトリ基準で解決して hash リンクに変換
function rewriteLinks(container, basePath) {
  const baseDir = basePath.includes('/') ? basePath.replace(/\/[^/]*$/, '/') : '';
  for (const a of container.querySelectorAll('a[href]')) {
    const href = a.getAttribute('href');
    if (/^(https?:)?\/\//.test(href) || href.startsWith('#')) {
      if (!href.startsWith('#')) a.target = '_blank';
      continue;
    }
    if (href.endsWith('.md')) {
      const resolved = new URL(href, location.origin + '/' + baseDir).pathname.slice(1);
      a.setAttribute('href', '#' + resolved);
    }
  }
}

async function fetchMd(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${res.status} ${path}`);
  return res.text();
}

async function render() {
  const path = currentPath();
  const content = document.getElementById('content');
  try {
    const md = await fetchMd(path);
    content.innerHTML = marked.parse(stripFrontmatter(md));
    rewriteLinks(content, path);
  } catch (e) {
    content.innerHTML = `<h1>ページが見つかりません</h1><p><code>${path}</code> を読み込めませんでした。</p>`;
  }
  for (const a of document.querySelectorAll('#sidebar a')) {
    a.classList.toggle('active', a.getAttribute('href') === '#' + path);
  }
  const slug = path.replace(/^.*\//, '').replace(/\.md$/, '');
  document.title = path === HOME ? 'llm-wiki' : `${slug} - llm-wiki`;
  window.scrollTo(0, 0);
}

async function init() {
  const index = await fetchMd(HOME);
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = marked.parse(index.replace(/^# Index$/m, `# [llm-wiki](#${HOME})`));
  rewriteLinks(sidebar, HOME);
  window.addEventListener('hashchange', render);
  render();
}

init();
</script>
</body>
</html>
